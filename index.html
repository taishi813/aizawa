<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AI Chat</title>


<style>

:root{
  --panel: rgba(255,255,255,0.94);
  --accent: #1976d2;
  --accent-light: #eaf3ff;
  --border: #d5e2f0;
  --text: #17212b;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#ffffff;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}


/* 上下の帯 */

body::before,
body::after{

  content:"";

  position:fixed;

  left:0;

  width:100%;

  height:60px;

  background:#ffffff;

  z-index:10;

}

body::before{
  top:0;
}

body::after{
  bottom:0;
}


/* 背景 */

.bg{

  position:fixed;

  inset:0;

  background:#eef5fb;

  background-size:cover;

  background-position:center;

  filter:
    brightness(0.8)
    blur(10px);

  z-index:0;

}


/* キャラクター */

.character{

  position:fixed;

  right:0;

  bottom:0;

  height:100%;

  max-width:55%;

  object-fit:contain;

  z-index:1;

  pointer-events:none;

}


/* UI */

.left-panel{

  position:fixed;

  top:60px;

  bottom:60px;

  left:0;

  width:45%;

  display:flex;

  flex-direction:column;

  z-index:5;

}


/* キャラクター選択 */

.top-bar{

  padding:10px;

  background:var(--panel);

  border-bottom:1px solid var(--border);

}


/* 基本プロンプト */

.prompt-area{

  padding:10px;

  background:#ffffff;

  border-bottom:1px solid var(--border);

}


.prompt-label{

  font-size:13px;

  font-weight:bold;

  color:#1976d2;

  margin-bottom:6px;

}


#prompt{

  width:100%;

  height:120px;

  resize:vertical;

  border:1px solid var(--border);

  border-radius:10px;

  padding:10px;

  outline:none;

  font-size:14px;

  line-height:1.6;

  color:var(--text);

  background:#f8fbff;

}


#prompt:focus{

  border-color:var(--accent);

  background:#ffffff;

}


/* select */

select{

  width:100%;

  padding:10px;

  border:1px solid var(--border);

  border-radius:10px;

  font-size:16px;

  background:#ffffff;

  color:var(--text);

}


/* チャット */

.chat{

  flex:1;

  overflow-y:auto;

  padding:16px;

  background:
    linear-gradient(
      to right,
      rgba(255,255,255,0.96),
      rgba(255,255,255,0.78),
      rgba(255,255,255,0)
    );

}


/* メッセージ */

.message{

  max-width:90%;

  margin-bottom:14px;

  padding:12px 16px;

  border-radius:16px;

  line-height:1.8;

  white-space:pre-wrap;

  word-break:break-word;

}


.user{

  background:var(--accent);

  color:white;

  margin-left:auto;

}


.ai{

  background:rgba(255,255,255,0.9);

  border:1px solid var(--border);

  backdrop-filter:blur(6px);

}


/* 入力 */

.input-area{

  display:flex;

  gap:10px;

  padding:10px;

  background:#ffffff;

  border-top:1px solid var(--border);

}


textarea#input{

  flex:1;

  height:60px;

  resize:none;

  border:1px solid var(--border);

  outline:none;

  border-radius:10px;

  padding:10px;

  font-size:16px;

  color:var(--text);

  background:#ffffff;

}


textarea#input:focus{

  border-color:var(--accent);

}


button{

  width:80px;

  border:none;

  border-radius:10px;

  background:var(--accent);

  color:white;

  font-size:16px;

  cursor:pointer;

}


button:hover{

  opacity:0.9;

}


/* スマホ */

@media (max-width:768px){

  body::before,
  body::after{

    height:40px;

  }


  .left-panel{

    width:100%;

    top:40px;

    bottom:40px;

  }


  .character{

    left:50%;

    transform:
      translateX(-50%);

    max-width:100%;

    opacity:0.18;

  }


  .prompt-area{

    padding:8px;

  }


  #prompt{

    height:100px;

  }


  .message{

    max-width:96%;

  }

}

</style>

</head>


<body>


<!-- 背景 -->

<div id="bg"
     class="bg">
</div>


<!-- キャラクター -->

<img id="characterImg"
     class="character"
     style="display:none;">


<div class="left-panel">


  <!-- キャラクター選択 -->

  <div class="top-bar">

    <select id="characterSelect">

      <option value="manager">
        マネージャー
      </option>

      <option value="aizawa">
        相澤仁美
      </option>

      <option value="ogura">
        小倉優香
      </option>

      <option value="harumi">
        根本はるみ
      </option>

      <option value="wacchi">
        わちみなみ
      </option>

      <option value="yanase">
        柳瀬早紀
      </option>

      <option value="ramu">
        RaMu
      </option>

      <option value="rika">
        泉里香
      </option>

      <option value="io">
        伊織いお
      </option>

      <option value="fun">
        バトルファン
      </option>

      <option value="fun2">
        バトルファン２
      </option>

    </select>

  </div>


  <!-- 基本プロンプト -->

  <div class="prompt-area">

    <div class="prompt-label">
      基本プロンプト
    </div>

    <textarea id="prompt"
      placeholder="このキャラクターの基本設定を入力">
    </textarea>

  </div>


  <!-- チャット -->

  <div id="chat"
       class="chat">
  </div>


  <!-- 入力 -->

  <div class="input-area">

    <textarea
      id="input"
      placeholder="メッセージ入力">
    </textarea>

    <button id="sendBtn">
      送信
    </button>

  </div>


</div>


<script>


/* =========================
   DOM
========================= */

const chat =
  document.getElementById(
    "chat"
  );


const input =
  document.getElementById(
    "input"
  );


const prompt =
  document.getElementById(
    "prompt"
  );


const sendBtn =
  document.getElementById(
    "sendBtn"
  );


const characterSelect =
  document.getElementById(
    "characterSelect"
  );


const characterImg =
  document.getElementById(
    "characterImg"
  );


const bg =
  document.getElementById(
    "bg"
  );


/* =========================
   履歴
========================= */

let history = [];


/* =========================
   キャラクター
========================= */

async function applyCharacter(){

  const char =
    characterSelect.value;


  if(char === "normal"){

    characterImg.style.display =
      "none";

    bg.style.backgroundImage =
      "none";

    bg.style.background =
      "#eef5fb";

    prompt.value = "";

    return;

  }


  characterImg.style.display =
    "block";


  characterImg.src =
    `${char}.png`;


  bg.style.backgroundImage =
    `url('${char}.jpg')`;


  /* =====================
     基本プロンプト読み込み
  ===================== */

  try{

    const response =
      await fetch(
        `${char}.txt`
      );


    if(response.ok){

      prompt.value =
        await response.text();

    }else{

      prompt.value =
        "";

    }

  }catch(err){

    console.error(
      "PROMPT LOAD ERROR:",
      err
    );

    prompt.value =
      "";

  }

}


/* =========================
   キャラクター変更
========================= */

characterSelect.addEventListener(
  "change",
  () => {

    history = [];

    chat.innerHTML = "";

    applyCharacter();

  }
);


/* =========================
   初期化
========================= */

applyCharacter();


/* =========================
   メッセージ表示
========================= */

function addMessage(
  text,
  type
){

  const div =
    document.createElement(
      "div"
    );


  div.className =
    "message " + type;


  div.textContent =
    text;


  chat.appendChild(
    div
  );


  requestAnimationFrame(
    () => {

      chat.scrollTop =
        chat.scrollHeight;

    }
  );

}


/* =========================
   送信
========================= */

async function send(){

  const text =
    input.value.trim();


  if(!text){

    return;

  }


  /* ユーザー */

  addMessage(
    text,
    "user"
  );


  input.value = "";


  /* 履歴 */

  history.push({

    role:"user",

    content:text

  });


  history =
    history.slice(-10);


  /* ローディング */

  const loading =
    document.createElement(
      "div"
    );


  loading.className =
    "message ai";


  loading.textContent =
    "考え中…";


  chat.appendChild(
    loading
  );


  try{

    /* =====================
       API
    ===================== */

    const response =
      await fetch(
        window.location.origin +
        "/api/deepseek",
        {

          method:"POST",

          headers:{

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              history:history,

              character:
                characterSelect.value,

              prompt:
                prompt.value

            })

        }
      );


    /* textとして取得 */

    const raw =
      await response.text();


    loading.remove();


    /* JSON解析 */

    let data;


    try{

      data =
        JSON.parse(raw);

    }catch(parseError){

      addMessage(

        "APIからJSONではないレスポンスが返りました。\n\n" +

        "HTTP Status: " +
        response.status +

        "\n\n" +

        raw,

        "ai"

      );

      return;

    }


    /* HTTPエラー */

    if(!response.ok){

      addMessage(

        "APIエラー:\n\n" +

        (
          data.error ||
          "unknown error"
        ),

        "ai"

      );

      return;

    }


    /* reply確認 */

    if(
      typeof data.reply !==
      "string"
    ){

      addMessage(

        "APIレスポンスに reply がありません。\n\n" +

        JSON.stringify(
          data,
          null,
          2
        ),

        "ai"

      );

      return;

    }


    /* 正常 */

    addMessage(
      data.reply,
      "ai"
    );


    history.push({

      role:"assistant",

      content:data.reply

    });


  }catch(err){

    console.error(
      "FETCH ERROR:",
      err
    );


    loading.remove();


    addMessage(

      "FETCHエラー\n\n" +

      (
        err.message ||
        String(err)
      ),

      "ai"

    );

  }

}


/* =========================
   Enter
========================= */

input.addEventListener(
  "keydown",
  e => {

    if(

      e.key === "Enter" &&

      !e.shiftKey &&

      !e.isComposing

    ){

      e.preventDefault();

      send();

    }

  }
);


/* =========================
   ボタン
========================= */

sendBtn.onclick =
  send;


</script>


</body>

</html>
