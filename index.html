<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AI Chat</title>


<style>

:root{
  --panel:rgba(255,255,255,0.96);
  --accent:#1976d2;
  --accent-light:#eaf3ff;
  --border:#d5e2f0;
  --text:#17212b;
  --chat-width:900px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#ffffff;
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;
}


/* =========================
   背景
========================= */

.bg{

  position:fixed;

  inset:0;

  background:#eef5fb;

  background-size:cover;

  background-position:center;

  filter:
    brightness(0.8)
    blur(10px);

  z-index:0;

}


/* =========================
   キャラクター
========================= */

.character{

  position:fixed;

  right:0;

  bottom:0;

  height:100%;

  max-width:55%;

  object-fit:contain;

  z-index:1;

  pointer-events:none;

}


/* =========================
   上下の白帯
========================= */

body::before,
body::after{

  content:"";

  position:fixed;

  left:0;

  width:100%;

  height:60px;

  background:#ffffff;

  z-index:10;

}

body::before{
  top:0;
}

body::after{
  bottom:0;
}


/* =========================
   メインパネル
========================= */

.left-panel{

  position:fixed;

  top:60px;

  bottom:60px;

  left:0;

  width:55%;

  display:flex;

  flex-direction:column;

  z-index:5;

}


/* =========================
   キャラクター選択
========================= */

.top-bar{

  padding:10px 18px;

  background:var(--panel);

  border-bottom:1px solid var(--border);

}


/* =========================
   基本プロンプト
========================= */

.prompt-area{

  background:#ffffff;

  border-bottom:1px solid var(--border);

}


/* 開閉ボタン */

.prompt-toggle{

  width:100%;

  height:42px;

  padding:
    0
    18px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  border:none;

  border-radius:0;

  background:#ffffff;

  color:var(--accent);

  font-size:13px;

  font-weight:bold;

  text-align:left;

  cursor:pointer;

}


.prompt-toggle:hover{

  background:#f8fbff;

}


/* 矢印 */

.prompt-arrow{

  font-size:14px;

  transition:
    transform 0.2s ease;

}


/* 開いている状態 */

.prompt-area.open
.prompt-arrow{

  transform:
    rotate(180deg);

}


/* プロンプト本体 */

.prompt-content{

  display:none;

  padding:
    0
    18px
    12px
    18px;

}


/* 開いている状態 */

.prompt-area.open
.prompt-content{

  display:block;

}


#prompt{

  width:100%;

  height:120px;

  resize:vertical;

  border:1px solid var(--border);

  border-radius:10px;

  padding:10px;

  outline:none;

  font-size:14px;

  line-height:1.6;

  color:var(--text);

  background:#f8fbff;

}


#prompt:focus{

  border-color:var(--accent);

  background:#ffffff;

}


/* =========================
   select
========================= */

select{

  width:100%;

  padding:10px;

  border:1px solid var(--border);

  border-radius:10px;

  font-size:16px;

  background:#ffffff;

  color:var(--text);

}


/* =========================
   チャット
========================= */

.chat{

  flex:1;

  overflow-y:auto;

  padding:
    24px
    max(24px, calc((100% - var(--chat-width)) / 2));

  background:
    linear-gradient(
      to right,
      rgba(255,255,255,0.97),
      rgba(255,255,255,0.88),
      rgba(255,255,255,0.45)
    );

}


/* =========================
   メッセージ
========================= */

.message{

  max-width:90%;

  margin-bottom:16px;

  padding:13px 17px;

  border-radius:16px;

  line-height:1.8;

  white-space:pre-wrap;

  word-break:break-word;

  font-size:15px;

}


.user{

  background:var(--accent);

  color:white;

  margin-left:auto;

}


.ai{

  background:rgba(255,255,255,0.94);

  border:1px solid var(--border);

  backdrop-filter:blur(6px);

}


/* =========================
   画像プレビュー
========================= */

.image-preview-area{

  display:none;

  padding:8px 18px;

  background:#ffffff;

  border-top:1px solid var(--border);

}


.image-preview-container{

  position:relative;

  display:inline-block;

}


#imagePreview{

  display:block;

  max-width:180px;

  max-height:120px;

  border-radius:10px;

  border:1px solid var(--border);

  object-fit:contain;

}


#removeImageBtn{

  position:absolute;

  top:-7px;

  right:-7px;

  width:24px;

  height:24px;

  padding:0;

  border:none;

  border-radius:50%;

  background:#ffffff;

  color:#555;

  border:1px solid var(--border);

  font-size:16px;

  line-height:22px;

  cursor:pointer;

}


/* =========================
   入力エリア
========================= */

.input-area{

  display:flex;

  gap:10px;

  padding:10px 18px;

  background:#ffffff;

  border-top:1px solid var(--border);

}


textarea#input{

  flex:1;

  height:60px;

  resize:none;

  border:1px solid var(--border);

  outline:none;

  border-radius:10px;

  padding:10px;

  font-size:16px;

  line-height:1.5;

  color:var(--text);

  background:#ffffff;

}


textarea#input:focus{

  border-color:var(--accent);

}


/* =========================
   画像ボタン
========================= */

#imageBtn{

  width:52px;

  flex-shrink:0;

  border:1px solid var(--border);

  border-radius:10px;

  background:#f8fbff;

  color:var(--accent);

  font-size:24px;

  cursor:pointer;

}


#imageBtn:hover{

  background:var(--accent-light);

}


#imageInput{

  display:none;

}


/* =========================
   送信ボタン
========================= */

#sendBtn{

  width:80px;

  flex-shrink:0;

  border:none;

  border-radius:10px;

  background:var(--accent);

  color:white;

  font-size:16px;

  cursor:pointer;

}


#sendBtn:hover{

  opacity:0.9;

}


/* =========================================================
   PC / MacBook
========================================================= */

@media (min-width:769px){

  .left-panel{

    width:70%;

    top:0;

    bottom:0;

    background:
      rgba(255,255,255,0.08);

  }


  body::before,
  body::after{

    display:none;

  }


  .character{

    max-width:45%;

    height:95%;

  }


  .top-bar{

    padding:
      14px
      24px;

  }


  .prompt-toggle{

    padding:
      0
      24px;

  }


  .prompt-content{

    padding:
      0
      24px
      14px
      24px;

  }


  #prompt{

    height:150px;

  }


  .chat{

    padding-top:28px;

    padding-bottom:28px;

    padding-left:
      max(
        30px,
        calc((100% - var(--chat-width)) / 2)
      );

    padding-right:
      max(
        30px,
        calc((100% - var(--chat-width)) / 2)
      );

  }


  .message{

    max-width:78%;

    font-size:16px;

    margin-bottom:18px;

    padding:
      14px
      18px;

  }


  .input-area{

    padding:
      14px
      24px;

  }


  textarea#input{

    height:64px;

  }


  .image-preview-area{

    padding:
      10px
      24px;

  }

}


/* =========================================================
   大きめのMac / PC
========================================================= */

@media (min-width:1200px){

  .left-panel{

    width:72%;

  }


  .character{

    max-width:42%;

  }


  .message{

    max-width:75%;

  }

}


/* =========================================================
   小さいPC / MacBook
========================================================= */

@media (min-width:769px) and (max-width:1100px){

  .left-panel{

    width:68%;

  }


  .character{

    max-width:48%;

    opacity:0.8;

  }


  .message{

    max-width:82%;

  }


  #prompt{

    height:125px;

  }

}


/* =========================================================
   スマホ
========================================================= */

@media (max-width:768px){

  body::before,
  body::after{

    height:40px;

  }


  .left-panel{

    width:100%;

    top:40px;

    bottom:40px;

  }


  .character{

    left:50%;

    right:auto;

    transform:
      translateX(-50%);

    max-width:100%;

    opacity:0.18;

  }


  .top-bar{

    padding:8px;

  }


  .prompt-toggle{

    padding:
      0
      8px;

  }


  .prompt-content{

    padding:
      0
      8px
      8px
      8px;

  }


  #prompt{

    height:100px;

  }


  .chat{

    padding:16px;

    background:
      linear-gradient(
        to right,
        rgba(255,255,255,0.96),
        rgba(255,255,255,0.78),
        rgba(255,255,255,0)
      );

  }


  .message{

    max-width:96%;

    font-size:15px;

  }


  .image-preview-area{

    padding:8px;

  }


  #imagePreview{

    max-width:140px;

    max-height:100px;

  }


  .input-area{

    padding:10px;

  }


  #imageBtn{

    width:48px;

  }


  #sendBtn{

    width:70px;

  }

}

</style>

</head>


<body>


<!-- =========================
     背景
========================= -->

<div id="bg"
     class="bg">
</div>


<!-- =========================
     キャラクター
========================= -->

<img id="characterImg"
     class="character"
     style="display:none;">


<div class="left-panel">


  <!-- =====================
       キャラクター選択
  ====================== -->

  <div class="top-bar">

    <select id="characterSelect">

      <option value="manager">
        ブランク
      </option>

      <option value="aizawa">
        相澤仁美
      </option>

      <option value="ogura">
        小倉優香
      </option>

      <option value="harumi">
        根本はるみ
      </option>

      <option value="wacchi">
        わちみなみ
      </option>

      <option value="yanase">
        柳瀬早紀
      </option>

      <option value="ramu">
        RaMu
      </option>

      <option value="rika">
        泉里香
      </option>

      <option value="io">
        伊織いお
      </option>

    </select>

  </div>


  <!-- =====================
       基本プロンプト
  ====================== -->

  <div
    id="promptArea"
    class="prompt-area">


    <button
      id="promptToggle"
      class="prompt-toggle"
      type="button">

      <span>
        基本プロンプト
      </span>

      <span
        id="promptArrow"
        class="prompt-arrow">
        ▼
      </span>

    </button>


    <div
      id="promptContent"
      class="prompt-content">

      <textarea
        id="prompt"
        placeholder="このキャラクターの基本設定を入力"></textarea>

    </div>


  </div>


  <!-- =====================
       チャット
  ====================== -->

  <div
    id="chat"
    class="chat">
  </div>


  <!-- =====================
       画像プレビュー
  ====================== -->

  <div
    id="imagePreviewArea"
    class="image-preview-area">

    <div
      class="image-preview-container">

      <img
        id="imagePreview"
        alt="画像プレビュー">


      <button
        id="removeImageBtn"
        type="button">

        ×

      </button>

    </div>

  </div>


  <!-- =====================
       入力
  ====================== -->

  <div class="input-area">


    <!-- 画像 -->

    <button
      id="imageBtn"
      type="button"
      title="画像を選択">

      📷

    </button>


    <input
      id="imageInput"
      type="file"
      accept="image/jpeg,image/png,image/gif,image/webp">


    <!-- テキスト -->

    <textarea
      id="input"
      placeholder="メッセージ入力"></textarea>


    <!-- 送信 -->

    <button
      id="sendBtn"
      type="button">

      送信

    </button>


  </div>


</div>


<script>


/* =========================
   DOM
========================= */

const chat =
  document.getElementById(
    "chat"
  );


const input =
  document.getElementById(
    "input"
  );


const prompt =
  document.getElementById(
    "prompt"
  );


const sendBtn =
  document.getElementById(
    "sendBtn"
  );


const characterSelect =
  document.getElementById(
    "characterSelect"
  );


const characterImg =
  document.getElementById(
    "characterImg"
  );


const bg =
  document.getElementById(
    "bg"
  );


const imageBtn =
  document.getElementById(
    "imageBtn"
  );


const imageInput =
  document.getElementById(
    "imageInput"
  );


const imagePreviewArea =
  document.getElementById(
    "imagePreviewArea"
  );


const imagePreview =
  document.getElementById(
    "imagePreview"
  );


const removeImageBtn =
  document.getElementById(
    "removeImageBtn"
  );


const promptArea =
  document.getElementById(
    "promptArea"
  );


const promptToggle =
  document.getElementById(
    "promptToggle"
  );


/* =========================
   履歴
========================= */

let history = [];


/* =========================
   選択画像
========================= */

let selectedImage = null;


/* =========================
   基本プロンプト開閉
========================= */

promptToggle.addEventListener(
  "click",
  () => {

    promptArea.classList.toggle(
      "open"
    );

  }
);


/* =========================
   キャラクター
========================= */

async function applyCharacter(){

  const char =
    characterSelect.value;


  if(char === "normal"){

    characterImg.style.display =
      "none";

    bg.style.backgroundImage =
      "none";

    bg.style.background =
      "#eef5fb";

    prompt.value = "";

    return;

  }


  characterImg.style.display =
    "block";


  characterImg.src =
    `${char}.png`;


  bg.style.backgroundImage =
    `url('${char}.jpg')`;


  try{

    const response =
      await fetch(
        `${char}.txt`
      );


    if(response.ok){

      prompt.value =
        await response.text();

    }else{

      prompt.value =
        "";

    }

  }catch(err){

    console.error(
      "PROMPT LOAD ERROR:",
      err
    );

    prompt.value =
      "";

  }

}


/* =========================
   キャラクター変更
========================= */

characterSelect.addEventListener(
  "change",
  () => {

    history = [];

    chat.innerHTML = "";

    removeSelectedImage();

    applyCharacter();

  }
);


/* =========================
   初期化
========================= */

applyCharacter();


/* =========================
   メッセージ表示
========================= */

function addMessage(
  text,
  type
){

  const div =
    document.createElement(
      "div"
    );


  div.className =
    "message " + type;


  div.textContent =
    text;


  chat.appendChild(
    div
  );


  requestAnimationFrame(
    () => {

      chat.scrollTop =
        chat.scrollHeight;

    }
  );

}


/* =========================
   画像選択
========================= */

imageBtn.addEventListener(
  "click",
  () => {

    imageInput.click();

  }
);


/* =========================
   画像読み込み
========================= */

imageInput.addEventListener(
  "change",
  () => {

    const file =
      imageInput.files[0];


    if(!file){

      return;

    }


    const allowedTypes = [

      "image/jpeg",

      "image/png",

      "image/gif",

      "image/webp"

    ];


    if(
      !allowedTypes.includes(
        file.type
      )
    ){

      alert(
        "JPEG、PNG、GIF、WebPの画像を選択してください。"
      );

      imageInput.value = "";

      return;

    }


    const reader =
      new FileReader();


    reader.onload = () => {

      selectedImage =
        reader.result;


      imagePreview.src =
        selectedImage;


      imagePreviewArea.style.display =
        "block";

    };


    reader.onerror = () => {

      alert(
        "画像の読み込みに失敗しました。"
      );

    };


    reader.readAsDataURL(file);

  }
);


/* =========================
   画像削除
========================= */

function removeSelectedImage(){

  selectedImage =
    null;


  imageInput.value =
    "";


  imagePreview.src =
    "";


  imagePreviewArea.style.display =
    "none";

}


removeImageBtn.addEventListener(
  "click",
  removeSelectedImage
);


/* =========================
   送信
========================= */

async function send(){

  const text =
    input.value.trim();


  if(
    !text &&
    !selectedImage
  ){

    return;

  }


  /* =====================
     ユーザー表示
  ===================== */

  if(text){

    addMessage(
      text,
      "user"
    );

  }else{

    addMessage(
      "📷 画像を送信",
      "user"
    );

  }


  input.value = "";


  /* =====================
     履歴
  ===================== */

  if(text){

    history.push({

      role:"user",

      content:text

    });

  }


  history =
    history.slice(-10);


  /* =====================
     ローディング
  ===================== */

  const loading =
    document.createElement(
      "div"
    );


  loading.className =
    "message ai";


  loading.textContent =
    "考え中…";


  chat.appendChild(
    loading
  );


  /* =====================
     今回の画像
  ===================== */

  const imageToSend =
    selectedImage;


  removeSelectedImage();


  try{

    const response =
      await fetch(
        window.location.origin +
        "/api/deepseek",
        {

          method:"POST",

          headers:{

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              history:
                history,

              character:
                characterSelect.value,

              prompt:
                prompt.value,

              image:
                imageToSend

            })

        }
      );


    const raw =
      await response.text();


    loading.remove();


    /* =====================
       JSON解析
    ===================== */

    let data;


    try{

      data =
        JSON.parse(raw);

    }catch(parseError){

      addMessage(

        "APIからJSONではないレスポンスが返りました。\n\n" +

        "HTTP Status: " +
        response.status +

        "\n\n" +

        raw,

        "ai"

      );

      return;

    }


    /* =====================
       HTTPエラー
    ===================== */

    if(!response.ok){

      addMessage(

        "APIエラー:\n\n" +

        (
          data.error ||
          "unknown error"
        ),

        "ai"

      );

      return;

    }


    /* =====================
       reply確認
    ===================== */

    if(
      typeof data.reply !==
      "string"
    ){

      addMessage(

        "APIレスポンスに reply がありません。\n\n" +

        JSON.stringify(
          data,
          null,
          2
        ),

        "ai"

      );

      return;

    }


    /* =====================
       正常
    ===================== */

    addMessage(
      data.reply,
      "ai"
    );


    history.push({

      role:"assistant",

      content:data.reply

    });


    history =
      history.slice(-10);


  }catch(err){

    console.error(
      "FETCH ERROR:",
      err
    );


    loading.remove();


    addMessage(

      "FETCHエラー\n\n" +

      (
        err.message ||
        String(err)
      ),

      "ai"

    );

  }

}


/* =========================
   Enter
========================= */

input.addEventListener(
  "keydown",
  e => {

    if(

      e.key === "Enter" &&

      !e.shiftKey &&

      !e.isComposing

    ){

      e.preventDefault();

      send();

    }

  }
);


/* =========================
   送信ボタン
========================= */

sendBtn.onclick =
  send;


</script>


</body>

</html>
