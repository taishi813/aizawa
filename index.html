<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Titfuck AI Chat</title>

<style>

:root{
  --panel: rgba(10,10,12,0.88);
  --accent: #ff4fa3;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

/* 黒帯 */

body::before,
body::after{
  content:"";
  position:fixed;
  left:0;
  width:100%;
  height:60px;
  background:black;
  z-index:10;
}

body::before{
  top:0;
}

body::after{
  bottom:0;
}

/* 背景 */

.bg{
  position:fixed;
  inset:0;
  background:#111;
  background-size:cover;
  background-position:center;
  filter:brightness(0.45) blur(10px);
  z-index:0;
}

/* キャラ */

.character{
  position:fixed;
  right:0;
  bottom:0;
  height:100%;
  max-width:55%;
  object-fit:contain;
  z-index:1;
  pointer-events:none;
}

/* UI */

.left-panel{
  position:fixed;
  top:60px;
  bottom:60px;
  left:0;
  width:45%;
  display:flex;
  flex-direction:column;
  z-index:5;
}

.top-bar{
  padding:10px;
  background:var(--panel);
}

select{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:16px;
  background:linear-gradient(
    to right,
    rgba(10,10,12,0.95),
    rgba(10,10,12,0.72),
    rgba(10,10,12,0)
  );
}

.message{
  max-width:90%;
  margin-bottom:14px;
  padding:12px 16px;
  border-radius:16px;
  line-height:1.8;
  white-space:pre-wrap;
  word-break:break-word;
}

.user{
  background:var(--accent);
  margin-left:auto;
}

.ai{
  background:rgba(255,255,255,0.14);
  backdrop-filter:blur(6px);
}

.input-area{
  display:flex;
  gap:10px;
  padding:10px;
  background:var(--panel);
}

textarea{
  flex:1;
  height:60px;
  resize:none;
  border:none;
  outline:none;
  border-radius:10px;
  padding:10px;
  font-size:16px;
}

button{
  width:80px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:white;
  font-size:16px;
  cursor:pointer;
}

@media (max-width:768px){

  body::before,
  body::after{
    height:40px;
  }

  .left-panel{
    width:100%;
    top:40px;
    bottom:40px;
  }

  .character{
    left:50%;
    transform:translateX(-50%);
    max-width:100%;
    opacity:0.22;
  }

  .message{
    max-width:96%;
  }
}

</style>
</head>

<body>

<div id="bg" class="bg"></div>

<img
  id="characterImg"
  class="character"
  style="display:none;"
>

<div class="left-panel">

  <div class="top-bar">

    <select id="characterSelect">


      <option value="manager">
        マネージャー
      </option>
      
      <option value="aizawa">
        相澤仁美
      </option>

      <option value="ogura">
        小倉優香
      </option>
      
            <option value="enako">
        えなこ
      </option>
      
                  <option value="wacchi">
        わちみなみ
      </option>

       <option value="yanase">
        柳瀬早紀
      </option>
      
      <option value="ramu">
        RaMu
      </option>
      
            <option value="rika">
        泉里香
      </option>
      
      

    </select>

  </div>

  <div id="chat" class="chat"></div>

  <div class="input-area">

    <textarea
      id="input"
      placeholder="メッセージ入力"
    ></textarea>

    <button id="sendBtn">
      送信
    </button>

  </div>

</div>

<script>

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const sendBtn =
  document.getElementById("sendBtn");

const characterSelect =
  document.getElementById("characterSelect");

const characterImg =
  document.getElementById("characterImg");

const bg =
  document.getElementById("bg");

let history = [];

/* キャラ */

function applyCharacter(){

  const char =
    characterSelect.value;

  if(char === "normal"){

    characterImg.style.display =
      "none";

    bg.style.background =
      "#111";

    return;
  }

  characterImg.style.display =
    "block";

  characterImg.src =
    `${char}.png`;

  bg.style.backgroundImage =
    `url('${char}.jpg')`;
}

characterSelect.addEventListener(
  "change",
  ()=>{

    history = [];

    chat.innerHTML = "";

    applyCharacter();
  }
);

applyCharacter();

/* メッセージ */

function addMessage(text,type){

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.textContent =
    text;

  chat.appendChild(div);

  requestAnimationFrame(()=>{

    chat.scrollTop =
      chat.scrollHeight;
  });
}

/* 送信 */

async function send(){

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  addMessage(text,"user");

  input.value = "";

  history.push({

    role:"user",

    content:text
  });

  history =
    history.slice(-10);

  const loading =
    document.createElement("div");

  loading.className =
    "message ai";

  loading.textContent =
    "考え中…";

  chat.appendChild(loading);

  try {

    const response =
      await fetch(
        window.location.origin +
        "/api/deepseek",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            history,

            character:
              characterSelect.value
          })
        }
      );

    const data =
      await response.json();

    loading.remove();

    if(!response.ok){

      addMessage(
        "エラー: " +
        (data.error || "unknown"),
        "ai"
      );

      return;
    }

    addMessage(
      data.reply,
      "ai"
    );

    history.push({

      role:"assistant",

      content:data.reply
    });

  } catch(err){

    console.error(err);

    loading.remove();

    addMessage(
      "通信エラー",
      "ai"
    );
  }
}

/* Enter */

input.addEventListener(
  "keydown",
  e=>{

    if(
      e.key === "Enter" &&
      !e.shiftKey &&
      !e.isComposing
    ){

      e.preventDefault();

      send();
    }
  }
);

sendBtn.onclick = send;

</script>

</body>
</html>
