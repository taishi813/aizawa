<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic AI Chat</title>

<style>

:root{
  --panel: rgba(10,10,12,0.88);
  --accent: #ff4fa3;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:black;
  color:white;
  height:100vh;
  overflow:hidden;
}

/* 黒帯 */

body::before,
body::after{
  content:"";
  position:fixed;
  left:0;
  width:100%;
  height:70px;
  background:black;
  z-index:10;
}

body::before{
  top:0;
}

body::after{
  bottom:0;
}

/* 背景 */

.bg{
  position:fixed;
  inset:0;
  background:linear-gradient(to bottom,#111,#000);
  background-size:cover;
  background-position:center;
  filter:brightness(0.45) blur(10px);
  z-index:0;
}

/* キャラ */

.character{
  position:fixed;
  right:0;
  bottom:0;
  height:100%;
  max-width:55%;
  object-fit:contain;
  z-index:1;
  pointer-events:none;
}

/* 左 */

.left-panel{
  position:fixed;
  top:70px;
  bottom:70px;
  left:0;
  width:45%;
  display:flex;
  flex-direction:column;
  z-index:5;
}

/* 上バー */

.top-bar{
  height:50px;
  padding:8px;
  background:var(--panel);
  display:flex;
  align-items:center;
}

select{
  padding:8px;
  border-radius:8px;
  border:none;
}

/* チャット */

.chat{
  flex:1;
  overflow-y:auto;
  padding:15px;
  background:linear-gradient(
    to right,
    rgba(10,10,12,0.95),
    rgba(10,10,12,0.7),
    rgba(10,10,12,0)
  );
}

/* メッセージ */

.message{
  max-width:85%;
  margin-bottom:14px;
  padding:12px 16px;
  border-radius:16px;
  line-height:1.8;
  white-space:pre-wrap;
}

.user{
  background:var(--accent);
  margin-left:auto;
}

.ai{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(6px);
}

/* 入力 */

.input-area{
  display:flex;
  padding:10px;
  gap:10px;
  background:var(--panel);
}

textarea{
  flex:1;
  height:60px;
  resize:none;
  border:none;
  outline:none;
  border-radius:10px;
  padding:10px;
  font-size:16px;
}

button{
  width:80px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:white;
  cursor:pointer;
}

/* スマホ */

@media (max-width:768px){

  body::before,
  body::after{
    height:40px;
  }

  .left-panel{
    width:100%;
    top:40px;
    bottom:40px;
  }

  .character{
    opacity:0.25;
    max-width:100%;
    left:50%;
    transform:translateX(-50%);
  }

  .message{
    max-width:95%;
  }
}

</style>
</head>

<body>

<div class="bg" id="bg"></div>

<img
  id="characterImg"
  class="character"
  src=""
  style="display:none;"
>

<div class="left-panel">

  <div class="top-bar">

    <select id="characterSelect">
      <option value="normal">
        ノーマル
      </option>

      <option value="aizawa">
        相澤仁美
      </option>

      <option value="ogura">
        小倉優香
      </option>
    </select>

  </div>

  <div id="chat" class="chat"></div>

  <div class="input-area">

    <textarea
      id="input"
      placeholder="メッセージ入力"
    ></textarea>

    <button id="sendBtn">
      送信
    </button>

  </div>

</div>

<script>

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const sendBtn =
  document.getElementById("sendBtn");

const characterSelect =
  document.getElementById("characterSelect");

const characterImg =
  document.getElementById("characterImg");

const bg =
  document.getElementById("bg");

let history = [];

/* キャラ切替 */

characterSelect.addEventListener(
  "change",
  ()=>{

    const char =
      characterSelect.value;

    if(char === "normal"){

      characterImg.style.display =
        "none";

      bg.style.backgroundImage =
        "linear-gradient(to bottom,#111,#000)";

    } else {

      characterImg.style.display =
        "block";

      characterImg.src =
        char + ".png";

      bg.style.backgroundImage =
        `url(${char}.jpg)`;
    }

    history = [];

    chat.innerHTML = "";
  }
);

/* 初期化 */

characterSelect.dispatchEvent(
  new Event("change")
);

/* メッセージ */

function addMessage(text,type){

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;
}

/* 送信 */

async function send(){

  const text =
    input.value.trim();

  if(!text) return;

  addMessage(text,"user");

  input.value = "";

  history.push({
    role:"user",
    content:text
  });

  history =
    history.slice(-10);

  const loading =
    document.createElement("div");

  loading.className =
    "message ai";

  loading.textContent =
    "考え中…";

  chat.appendChild(loading);

  chat.scrollTop =
    chat.scrollHeight;

  try {

    const res =
      await fetch(
        "./api/deepseek",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            history,

            character:
              characterSelect.value
          })
        }
      );

    const data =
      await res.json();

    loading.remove();

    if(!res.ok){

      addMessage(
        "エラー: " +
        data.error,
        "ai"
      );

      return;
    }

    addMessage(
      data.reply,
      "ai"
    );

    history.push({
      role:"assistant",
      content:data.reply
    });

  } catch(e){

    console.error(e);

    loading.remove();

    addMessage(
      "通信エラー: " +
      e.message,
      "ai"
    );
  }
}

/* Enter */

input.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="Enter" &&
      !e.shiftKey &&
      !e.isComposing
    ){

      e.preventDefault();

      send();
    }
  }
);

sendBtn.onclick = send;

</script>

</body>
</html>
