<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic AI Chat</title>

<style>
:root{
  --panel: rgba(10,10,12,0.88);
  --accent: #ff4fa3;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:black;
  color:white;
  height:100vh;
  overflow:hidden;
}

/* 🎬 黒帯 */
body::before,
body::after{
  content:"";
  position:fixed;
  left:0;
  width:100%;
  height:70px;
  background:black;
  z-index:10;
}

body::before{
  top:0;
}

body::after{
  bottom:0;
}

/* 背景 */
.bg{
  position:fixed;
  inset:0;
  background:linear-gradient(to bottom,#111,#000);
  background-size:cover;
  background-position:center;
  filter:brightness(0.45) blur(10px);
  z-index:0;
  transition:0.4s;
}

/* キャラ */
.character{
  position:fixed;
  right:0;
  bottom:0;
  height:100%;
  max-width:55%;
  object-fit:contain;
  z-index:1;
  pointer-events:none;
  transition:0.3s;
}

/* 左パネル */
.left-panel{
  position:fixed;
  top:70px;
  bottom:70px;
  left:0;
  width:45%;
  display:flex;
  flex-direction:column;
  z-index:5;
}

/* 上バー */
.top-bar{
  height:50px;
  padding:8px;
  background:var(--panel);
  border-bottom:1px solid rgba(255,255,255,0.1);
  display:flex;
  align-items:center;
  gap:10px;
}

select{
  padding:8px;
  border-radius:8px;
  border:none;
  background:#fff;
  font-size:15px;
}

/* チャット */
.chat{
  flex:1;
  overflow-y:auto;
  padding:15px;
  background:linear-gradient(
    to right,
    rgba(10,10,12,0.96),
    rgba(10,10,12,0.7),
    rgba(10,10,12,0)
  );
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}

/* メッセージ */
.message{
  max-width:85%;
  margin-bottom:14px;
  padding:12px 16px;
  border-radius:16px;
  line-height:1.8;
  font-size:15px;
  word-break:break-word;
  white-space:pre-wrap;
  animation:fade 0.2s ease;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.user{
  background:var(--accent);
  margin-left:auto;
}

.ai{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(6px);
}

/* 添付画像 */
.chat-image{
  width:100%;
  border-radius:12px;
  margin-top:10px;
}

/* 入力 */
.input-area{
  display:flex;
  padding:10px;
  gap:10px;
  background:var(--panel);
  align-items:flex-end;
}

textarea{
  flex:1;
  height:60px;
  resize:none;
  border-radius:10px;
  border:none;
  outline:none;
  padding:10px;
  background:#fff;
  color:#000;
  font-size:16px;
}

button{
  width:80px;
  height:60px;
  border-radius:10px;
  border:none;
  background:var(--accent);
  color:white;
  cursor:pointer;
  font-size:15px;
}

button:hover{
  opacity:0.9;
}

.image-btn{
  width:60px;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,0.12);
  border-radius:10px;
  cursor:pointer;
  font-size:24px;
  user-select:none;
}

/* プレビュー */
.preview-wrap{
  padding:10px;
  background:rgba(0,0,0,0.4);
  display:none;
}

.preview-wrap img{
  width:120px;
  border-radius:12px;
}

/* スクロール */
.chat::-webkit-scrollbar{
  width:6px;
}

.chat::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,0.2);
  border-radius:3px;
}

/* 📱スマホ */
@media (max-width:768px){

  body::before,
  body::after{
    height:40px;
  }

  .left-panel{
    width:100%;
    top:40px;
    bottom:40px;
  }

  .character{
    opacity:0.25;
    max-width:100%;
    left:50%;
    transform:translateX(-50%);
  }

  .message{
    max-width:95%;
  }

  textarea{
    height:50px;
    font-size:16px;
  }

  button{
    width:70px;
    height:50px;
  }

  .image-btn{
    width:50px;
    height:50px;
  }
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>

<img
  id="characterImg"
  class="character"
  src=""
  style="display:none;"
>

<div class="left-panel">

  <div class="top-bar">

    <select id="characterSelect">
      <option value="normal">ノーマル</option>
      <option value="aizawa">相澤仁美</option>
      <option value="ogura">小倉優香</option>
    </select>

  </div>

  <div id="chat" class="chat"></div>

  <!-- 画像プレビュー -->
  <div class="preview-wrap" id="previewWrap">
    <img id="previewImg">
  </div>

  <div class="input-area">

    <label class="image-btn">
      📷
      <input
        type="file"
        id="imageInput"
        accept="image/*"
        hidden
      >
    </label>

    <textarea
      id="input"
      placeholder="メッセージ入力"
    ></textarea>

    <button id="sendBtn">
      送信
    </button>

  </div>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

const characterSelect =
  document.getElementById("characterSelect");

const characterImg =
  document.getElementById("characterImg");

const bg =
  document.getElementById("bg");

const imageInput =
  document.getElementById("imageInput");

const previewWrap =
  document.getElementById("previewWrap");

const previewImg =
  document.getElementById("previewImg");

let history = [];
let currentImageBase64 = null;

/* キャラ切替 */
characterSelect.addEventListener("change", () => {

  const char = characterSelect.value;

  if(char === "normal"){

    characterImg.style.display = "none";

    bg.style.backgroundImage =
      "linear-gradient(to bottom,#111,#000)";

  } else {

    characterImg.style.display = "block";

    characterImg.src = char + ".png";

    bg.style.backgroundImage =
      `url(${char}.jpg)`;
  }

  history = [];
  chat.innerHTML = "";
});

/* 初期状態 */
characterSelect.dispatchEvent(
  new Event("change")
);

/* 画像選択 */
imageInput.addEventListener("change", e => {

  const file = e.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = () => {

    currentImageBase64 = reader.result;

    previewImg.src = currentImageBase64;

    previewWrap.style.display = "block";
  };

  reader.readAsDataURL(file);
});

/* ログ削減 */
function trimChat(){

  const messages =
    chat.querySelectorAll(".message");

  if(messages.length > 30){

    for(let i = 0; i < 10; i++){

      if(messages[i]){
        messages[i].remove();
      }
    }
  }
}

/* メッセージ */
function addMessage(text, type, image=null){

  const div = document.createElement("div");

  div.className = "message " + type;

  if(text){

    const textNode =
      document.createElement("div");

    textNode.textContent = text;

    div.appendChild(textNode);
  }

  if(image){

    const img =
      document.createElement("img");

    img.src = image;

    img.className = "chat-image";

    div.appendChild(img);
  }

  chat.appendChild(div);

  requestAnimationFrame(() => {
    chat.scrollTop = chat.scrollHeight;
  });

  trimChat();
}

/* 送信 */
async function send(){

  const text = input.value.trim();

  if(!text && !currentImageBase64){
    return;
  }

  addMessage(
    text,
    "user",
    currentImageBase64
  );

  input.value = "";

  history.push({
    role:"user",
    content:text,
    image:currentImageBase64
  });

  history = history.slice(-6);

  const loading =
    document.createElement("div");

  loading.className = "message ai";

  loading.textContent = "考え中…";

  chat.appendChild(loading);

  chat.scrollTop = chat.scrollHeight;

  try {

    const res = await fetch(
      "/api/deepseek",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body: JSON.stringify({

          history,
          character: characterSelect.value,
          image: currentImageBase64
        })
      }
    );

    const data = await res.json();

    loading.remove();

    if(!res.ok){

      addMessage(
        data.error || "エラー",
        "ai"
      );

      return;
    }

    addMessage(data.reply, "ai");

    history.push({
      role:"assistant",
      content:data.reply
    });

    /* リセット */
    currentImageBase64 = null;

    imageInput.value = "";

    previewWrap.style.display = "none";

  } catch(e){

    loading.remove();

    addMessage(
      "通信エラー",
      "ai"
    );
  }
}

/* Enter送信 */
input.addEventListener("keydown", e => {

  if(
    e.key === "Enter" &&
    !e.shiftKey &&
    !e.isComposing
  ){

    e.preventDefault();

    send();
  }
});

sendBtn.onclick = send;
</script>

</body>
</html>
