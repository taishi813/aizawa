<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Open Chat</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f8fc;
  color:#172033;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =========================
   Header
========================= */

.header{
  height:58px;
  background:#ffffff;
  border-bottom:1px solid #dce4ef;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  position:sticky;
  top:0;
  z-index:20;
}

.header-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.room-title{
  font-size:17px;
  font-weight:700;
  white-space:nowrap;
}

.online-count{
  font-size:12px;
  color:#718096;
  white-space:nowrap;
}

.join-header-button{
  border:1px solid #2d7ff9;
  background:#2d7ff9;
  color:white;

  border-radius:8px;
  padding:8px 13px;

  font-size:13px;
  font-weight:600;
}

.join-header-button:hover{
  background:#1769dc;
}

/* =========================
   Layout
========================= */

.page{
  display:flex;
  max-width:1400px;
  margin:0 auto;
  min-height:calc(100vh - 58px);
}

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.sidebar{
  width:280px;
  background:#ffffff;
  border-left:1px solid #dce4ef;
}

/* =========================
   Mobile participant chips
========================= */

.mobile-participants{
  display:none;

  padding:10px 12px;

  background:#ffffff;
  border-bottom:1px solid #e1e8f1;

  gap:7px;

  overflow-x:auto;
}

.participant-chip{
  flex:none;

  border:1px solid #dce4ef;
  background:#f8fafc;

  border-radius:999px;

  padding:6px 10px;

  font-size:12px;

  color:#334155;
}

.participant-chip.active{
  border-color:#2d7ff9;
  background:#edf5ff;
  color:#1769dc;
}

/* =========================
   Chat
========================= */

.chat-area{
  flex:1;
  overflow-y:auto;

  padding:20px 20px 120px;
}

.empty-room{
  text-align:center;
  color:#8a96a8;

  padding:80px 20px;

  font-size:14px;
}

.message{
  display:flex;
  gap:10px;

  margin-bottom:17px;

  max-width:900px;
}

.message.user-message{
  margin-left:auto;
}

.avatar{
  width:38px;
  height:38px;

  flex:none;

  border-radius:50%;

  background:#e7edf5;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:12px;
  color:#64748b;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.message-body{
  min-width:0;
  max-width:calc(100% - 48px);
}

.message-meta{
  display:flex;
  align-items:center;
  gap:8px;

  margin-bottom:4px;
}

.message-name{
  font-size:13px;
  font-weight:700;
  color:#26354a;
}

.message-time{
  font-size:10px;
  color:#9aa5b5;
}

.message-text{
  font-size:14px;
  line-height:1.75;

  white-space:pre-wrap;
  word-break:break-word;

  background:#ffffff;

  border:1px solid #e1e7ef;
  border-radius:10px;

  padding:10px 13px;
}

.user-message .message-text{
  background:#edf5ff;
  border-color:#cfe1fb;
}

.system-message{
  text-align:center;

  color:#9aa5b5;

  font-size:11px;

  margin:12px 0 18px;
}

/* =========================
   Typing
========================= */

.typing{
  display:flex;
  align-items:center;
  gap:8px;

  margin:0 0 18px 48px;

  color:#8a96a8;

  font-size:12px;
}

.typing-dots{
  display:flex;
  gap:3px;
}

.typing-dots span{
  width:5px;
  height:5px;

  background:#9aa8ba;

  border-radius:50%;

  animation:typing 1.2s infinite;
}

.typing-dots span:nth-child(2){
  animation-delay:.15s;
}

.typing-dots span:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{

  0%,60%,100%{
    opacity:.3;
    transform:translateY(0);
  }

  30%{
    opacity:1;
    transform:translateY(-2px);
  }

}

/* =========================
   Input
========================= */

.input-area{
  position:fixed;

  left:0;
  right:280px;
  bottom:0;

  background:rgba(255,255,255,.96);

  border-top:1px solid #dce4ef;

  padding:10px 16px;

  z-index:15;
}

.input-inner{
  max-width:900px;
  margin:0 auto;

  display:flex;
  gap:8px;
}

.current-speaker{
  min-width:120px;

  border:1px solid #dce4ef;
  background:#f8fafc;

  border-radius:8px;

  padding:0 10px;

  display:flex;
  align-items:center;

  font-size:12px;
  color:#475569;
}

.message-input{
  flex:1;

  min-width:0;

  border:1px solid #ccd7e5;

  border-radius:9px;

  padding:11px 13px;

  outline:none;

  background:#ffffff;

  resize:none;

  min-height:42px;
  max-height:140px;
}

.message-input:focus{
  border-color:#2d7ff9;
  box-shadow:0 0 0 2px rgba(45,127,249,.08);
}

.send-button{
  width:70px;

  border:0;

  border-radius:9px;

  background:#2d7ff9;
  color:white;

  font-weight:600;
}

.send-button:hover{
  background:#1769dc;
}

.send-button:disabled{
  opacity:.5;
  cursor:default;
}

/* =========================
   Sidebar
========================= */

.sidebar-inner{
  padding:18px 15px;
}

.sidebar-title{
  font-size:13px;
  font-weight:700;

  margin-bottom:12px;

  color:#475569;
}

.participant-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.participant{
  display:flex;
  align-items:center;
  gap:9px;

  width:100%;

  border:1px solid #e1e7ef;

  background:#ffffff;

  border-radius:9px;

  padding:8px;

  text-align:left;
}

.participant:hover{
  background:#f7faff;
}

.participant.active{
  border-color:#9fc5f7;
  background:#edf5ff;
}

.participant-avatar{
  width:32px;
  height:32px;

  flex:none;

  border-radius:50%;

  background:#e8eef6;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:10px;
}

.participant-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.participant-info{
  min-width:0;
  flex:1;
}

.participant-name{
  font-size:12px;
  font-weight:600;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.participant-type{
  font-size:10px;
  color:#8a96a8;

  margin-top:2px;
}

.online-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#35b875;

  flex:none;
}

.sidebar-buttons{
  display:flex;
  gap:7px;

  margin-top:14px;
}

.sidebar-button{
  flex:1;

  border:1px solid #d4deeb;

  background:#ffffff;

  border-radius:7px;

  padding:8px 5px;

  font-size:11px;

  color:#40516a;
}

.sidebar-button:hover{
  background:#f5f8fc;
}

/* =========================
   Modal
========================= */

.overlay{
  position:fixed;

  inset:0;

  background:rgba(15,23,42,.42);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:100;
}

.modal{
  width:min(460px,100%);

  background:#ffffff;

  border-radius:14px;

  box-shadow:0 20px 60px rgba(15,23,42,.2);

  overflow:hidden;
}

.modal-header{
  padding:17px 18px;

  border-bottom:1px solid #e4e9f0;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-title{
  font-size:16px;
  font-weight:700;
}

.close-button{
  width:32px;
  height:32px;

  border:0;

  background:#f1f5f9;

  border-radius:50%;

  color:#64748b;
}

.modal-body{
  padding:18px;
}

.form-group{
  margin-bottom:15px;
}

.form-label{
  display:block;

  font-size:12px;
  font-weight:600;

  color:#475569;

  margin-bottom:6px;
}

.form-input,
.form-select{
  width:100%;

  border:1px solid #ccd7e5;

  border-radius:8px;

  background:#ffffff;

  padding:10px 11px;

  outline:none;
}

.form-input:focus,
.form-select:focus{
  border-color:#2d7ff9;
}

.type-buttons{
  display:flex;
  gap:8px;
}

.type-button{
  flex:1;

  border:1px solid #d5deea;

  background:#ffffff;

  border-radius:8px;

  padding:10px;

  font-size:12px;

  color:#475569;
}

.type-button.active{
  border-color:#2d7ff9;

  background:#edf5ff;

  color:#1769dc;
}

.modal-footer{
  padding:13px 18px;

  border-top:1px solid #e4e9f0;

  display:flex;
  justify-content:flex-end;

  gap:8px;
}

.cancel-button{
  border:1px solid #d4deeb;

  background:#ffffff;

  border-radius:8px;

  padding:9px 14px;

  font-size:12px;
}

.confirm-button{
  border:0;

  background:#2d7ff9;
  color:white;

  border-radius:8px;

  padding:9px 15px;

  font-size:12px;

  font-weight:600;
}

/* =========================
   Responsive
========================= */

@media(max-width:800px){

  .sidebar{
    display:none;
  }

  .mobile-participants{
    display:flex;
  }

  .input-area{
    right:0;
  }

  .chat-area{
    padding:14px 10px 125px;
  }

  .message{
    max-width:100%;
  }

  .current-speaker{
    min-width:auto;
    width:42px;

    justify-content:center;

    padding:0;
  }

  .current-speaker span{
    display:none;
  }

  .send-button{
    width:55px;
  }

}

</style>

</head>


<body>


<!-- =========================
     Header
========================= -->

<header class="header">

  <div class="header-left">

    <div class="room-title">
      オープンチャット
    </div>

    <div class="online-count"
         id="onlineCount">
      0人
    </div>

  </div>

  <button class="join-header-button"
          onclick="openJoinModal()">

    ＋ 入室

  </button>

</header>


<div class="page">


  <main class="main">


    <!-- Mobile participants -->

    <div class="mobile-participants"
         id="mobileParticipants">
    </div>


    <!-- Chat -->

    <div class="chat-area"
         id="chatArea">

      <div class="empty-room"
           id="emptyRoom">

        まだ誰も発言していません。<br>
        「＋ 入室」から参加できます。

      </div>

    </div>


  </main>


  <!-- =========================
       Sidebar
  ========================= -->

  <aside class="sidebar">

    <div class="sidebar-inner">

      <div class="sidebar-title">
        参加者
      </div>

      <div class="participant-list"
           id="participantList">
      </div>


      <div class="sidebar-buttons">

        <button class="sidebar-button"
                onclick="openJoinModal()">

          ＋ 入室する

        </button>

        <button class="sidebar-button"
                onclick="leaveCurrentParticipant()">

          退室する

        </button>

      </div>

    </div>

  </aside>


</div>


<!-- =========================
     Input
========================= -->

<div class="input-area">

  <div class="input-inner">

    <div class="current-speaker"
         id="currentSpeaker">

      <span>発言者を選択</span>

    </div>

    <textarea
      id="messageInput"
      class="message-input"
      placeholder="メッセージを入力..."
      rows="1"></textarea>

    <button
      id="sendButton"
      class="send-button"
      onclick="sendMessage()">

      送信

    </button>

  </div>

</div>


<!-- =========================
     Join Modal
========================= -->

<div class="overlay"
     id="joinOverlay"
     style="display:none;">

  <div class="modal">

    <div class="modal-header">

      <div class="modal-title">
        入室
      </div>

      <button class="close-button"
              onclick="closeJoinModal()">

        ×

      </button>

    </div>


    <div class="modal-body">


      <div class="form-group">

        <label class="form-label">
          発言者
        </label>

        <div class="type-buttons">

          <button
            id="userTypeButton"
            class="type-button active"
            onclick="selectJoinType('user')">

            自分で発言

          </button>

          <button
            id="aiTypeButton"
            class="type-button"
            onclick="selectJoinType('ai')">

            AIキャラクター

          </button>

        </div>

      </div>


      <div class="form-group"
           id="characterGroup"
           style="display:none;">

        <label class="form-label">
          キャラクター
        </label>

        <select
          id="characterSelect"
          class="form-select">

        </select>

      </div>


      <div class="form-group">

        <label class="form-label">
          表示名
        </label>

        <input
          id="displayNameInput"
          class="form-input"
          type="text"
          placeholder="表示名">

      </div>


    </div>


    <div class="modal-footer">

      <button class="cancel-button"
              onclick="closeJoinModal()">

        キャンセル

      </button>

      <button class="confirm-button"
              onclick="joinParticipant()">

        入室する

      </button>

    </div>

  </div>

</div>



<script>

/* =========================================================
   キャラクター設定
========================================================= */

const CHARACTER_NAMES = {

  blank: "大志",

  manager: "ブランク",

  aizawa: "相澤仁美",

  ogura: "小倉優香",

  harumi: "根本はるみ",

  wacchi: "わちみなみ",

  yanase: "柳瀬早紀",

  ramu: "RaMu",

  rika: "泉里香",

  io: "伊織いお"

};


/* =========================================================
   状態
========================================================= */

let participants = [];

let roomMessages = [];

let historyData = [];

let joinType = "user";

let currentSpeakerId = null;

let lastAIResponderId = null;

let aiBusy = false;


/*
  AIを順番に回すための番号。

  例えば、

  A
  B
  C

  といた場合、

  A → B → C → A → B → C

  のように基本的に回る。
*/
let aiRoundRobinIndex = 0;


/* =========================================================
   初期化
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    initializeCharacterSelect();

    await loadHistory();

    updateParticipantUI();

    updateCurrentSpeaker();

  }
);


/* =========================================================
   キャラクター選択肢
========================================================= */

function initializeCharacterSelect(){

  const select =
    document.getElementById("characterSelect");

  select.innerHTML = "";

  Object.entries(CHARACTER_NAMES)
    .forEach(
      ([key,name]) => {

        if(key === "blank"){
          return;
        }

        const option =
          document.createElement("option");

        option.value = key;
        option.textContent = name;

        select.appendChild(option);

      }
    );

}


/* =========================================================
   history.json
========================================================= */

async function loadHistory(){

  try{

    const response =
      await fetch("./history.json");

    if(!response.ok){
      throw new Error(
        "history.json の読み込みに失敗しました"
      );
    }

    historyData =
      await response.json();

  }catch(error){

    console.warn(error);

    historyData = [];

  }

}


/* =========================================================
   入室モーダル
========================================================= */

function openJoinModal(){

  document.getElementById(
    "joinOverlay"
  ).style.display = "flex";

  selectJoinType(joinType);

  document.getElementById(
    "displayNameInput"
  ).value = "";

}


function closeJoinModal(){

  document.getElementById(
    "joinOverlay"
  ).style.display = "none";

}


function selectJoinType(type){

  joinType = type;

  const userButton =
    document.getElementById(
      "userTypeButton"
    );

  const aiButton =
    document.getElementById(
      "aiTypeButton"
    );

  const characterGroup =
    document.getElementById(
      "characterGroup"
    );

  if(type === "user"){

    userButton.classList.add("active");
    aiButton.classList.remove("active");

    characterGroup.style.display =
      "none";

    document.getElementById(
      "displayNameInput"
    ).placeholder =
      "神田大志";

  }else{

    userButton.classList.remove("active");
    aiButton.classList.add("active");

    characterGroup.style.display =
      "block";

    updateDefaultAIName();

  }

}


document.getElementById(
  "characterSelect"
).addEventListener(
  "change",
  updateDefaultAIName
);


function updateDefaultAIName(){

  if(joinType !== "ai"){
    return;
  }

  const character =
    document.getElementById(
      "characterSelect"
    ).value;

  const baseName =
    getCharacterName(character);

  document.getElementById(
    "displayNameInput"
  ).value = baseName;

}


/* =========================================================
   入室
========================================================= */

function joinParticipant(){

  let displayName =
    document.getElementById(
      "displayNameInput"
    ).value.trim();


  let character = "blank";


  if(joinType === "user"){

    if(!displayName){
      displayName = "神田大志";
    }

    character = "blank";

  }else{

    character =
      document.getElementById(
        "characterSelect"
      ).value;

    if(!displayName){

      displayName =
        getCharacterName(character);

    }

  }


  /*
    同じ名前がすでにいる場合、

    相澤仁美
    ↓
    相澤仁美 2

    のようにする。
  */

  displayName =
    makeUniqueDisplayName(displayName);


  const participant = {

    id:
      "p_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,8),

    type:
      joinType,

    character:
      character,

    displayName:
      displayName,

    prompt:
      "",

    joinedAt:
      new Date().toISOString()

  };


  participants.push(participant);


  if(participant.type === "ai"){

    loadCharacterPrompt(participant);

  }


  /*
    最初に入った発言者を
    現在の発言者にする。
  */

  if(!currentSpeakerId){

    currentSpeakerId =
      participant.id;

  }


  closeJoinModal();

  updateParticipantUI();

  updateCurrentSpeaker();

  addSystemMessage(
    `${participant.displayName} が入室しました。`
  );

}


/* =========================================================
   名前重複回避
========================================================= */

function makeUniqueDisplayName(name){

  const names =
    participants.map(
      p => p.displayName
    );

  if(!names.includes(name)){
    return name;
  }


  let number = 2;

  while(
    names.includes(
      `${name} ${number}`
    )
  ){

    number++;

  }


  return `${name} ${number}`;

}


/* =========================================================
   プロンプト読み込み
========================================================= */

async function loadCharacterPrompt(
  participant
){

  try{

    const response =
      await fetch(
        `./${participant.character}.txt`
      );


    if(!response.ok){

      throw new Error(
        `${participant.character}.txt の読み込み失敗`
      );

    }


    participant.prompt =
      await response.text();


  }catch(error){

    console.warn(error);

    participant.prompt = "";

  }

}


/* =========================================================
   退室
========================================================= */

function leaveCurrentParticipant(){

  if(!currentSpeakerId){

    alert(
      "退室する参加者を選択してください。"
    );

    return;

  }


  const index =
    participants.findIndex(
      p =>
        p.id === currentSpeakerId
    );


  if(index === -1){
    return;
  }


  const participant =
    participants[index];


  participants.splice(
    index,
    1
  );


  addSystemMessage(
    `${participant.displayName} が退室しました。`
  );


  currentSpeakerId = null;


  /*
    残っている参加者がいれば
    最初の人を発言者にする。
  */

  if(participants.length){

    currentSpeakerId =
      participants[0].id;

  }


  updateParticipantUI();

  updateCurrentSpeaker();

}


/* =========================================================
   参加者UI
========================================================= */

function updateParticipantUI(){

  const list =
    document.getElementById(
      "participantList"
    );

  const mobile =
    document.getElementById(
      "mobileParticipants"
    );


  list.innerHTML = "";
  mobile.innerHTML = "";


  participants.forEach(
    participant => {

      /*
        PC
      */

      const item =
        document.createElement(
          "button"
        );

      item.className =
        "participant" +
        (
          participant.id === currentSpeakerId
            ? " active"
            : ""
        );

      item.onclick =
        () =>
          selectSpeaker(
            participant.id
          );


      const avatar =
        createAvatar(
          participant
        );


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "participant-info";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "participant-name";

      name.textContent =
        participant.displayName;


      const type =
        document.createElement(
          "div"
        );

      type.className =
        "participant-type";

      type.textContent =
        participant.type === "ai"
          ? "AI"
          : "自分";


      info.appendChild(name);
      info.appendChild(type);


      const dot =
        document.createElement(
          "div"
        );

      dot.className =
        "online-dot";


      item.appendChild(avatar);
      item.appendChild(info);
      item.appendChild(dot);


      list.appendChild(item);


      /*
        スマホ
      */

      const chip =
        document.createElement(
          "button"
        );

      chip.className =
        "participant-chip" +
        (
          participant.id === currentSpeakerId
            ? " active"
            : ""
        );

      chip.textContent =
        participant.displayName;

      chip.onclick =
        () =>
          selectSpeaker(
            participant.id
          );

      mobile.appendChild(chip);

    }
  );


  document.getElementById(
    "onlineCount"
  ).textContent =
    `${participants.length}人`;

}


/* =========================================================
   Avatar
========================================================= */

function createAvatar(
  participant
){

  const avatar =
    document.createElement(
      "div"
    );

  avatar.className =
    "avatar";


  const image =
    document.createElement(
      "img"
    );


  /*
    キャラクター画像が存在する場合。
  */

  if(
    participant.character &&
    participant.character !== "blank"
  ){

    image.src =
      `./${participant.character}.png`;

    image.onerror =
      function(){

        this.onerror = null;

        this.src =
          `./${participant.character}.jpg`;

      };

    image.onload =
      function(){

        avatar.innerHTML = "";

        avatar.appendChild(
          image
        );

      };

    /*
      画像がなかった場合は
      イニシャルを表示。
    */

    image.onerror =
      function(){

        this.onerror = null;

        const fallback =
          document.createElement(
            "span"
          );

        fallback.textContent =
          getInitial(
            participant.displayName
          );

        avatar.innerHTML = "";

        avatar.appendChild(
          fallback
        );

      };

    /*
      まず仮表示。
    */

    avatar.textContent =
      getInitial(
        participant.displayName
      );

  }else{

    avatar.textContent =
      getInitial(
        participant.displayName
      );

  }


  return avatar;

}


function getInitial(name){

  if(!name){
    return "?";
  }

  return name.slice(0,1);

}


/* =========================================================
   発言者選択
========================================================= */

function selectSpeaker(id){

  const participant =
    participants.find(
      p => p.id === id
    );

  if(!participant){
    return;
  }


  currentSpeakerId = id;

  updateParticipantUI();

  updateCurrentSpeaker();

}


function updateCurrentSpeaker(){

  const element =
    document.getElementById(
      "currentSpeaker"
    );


  const participant =
    participants.find(
      p =>
        p.id === currentSpeakerId
    );


  if(!participant){

    element.innerHTML =
      "<span>発言者を選択</span>";

    return;

  }


  element.innerHTML =
    `<span>${escapeHtml(
      participant.displayName
    )}</span>`;

}


/* =========================================================
   メッセージ送信
========================================================= */

async function sendMessage(){

  if(aiBusy){
    return;
  }


  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if(!text){
    return;
  }


  const speaker =
    participants.find(
      p =>
        p.id === currentSpeakerId
    );


  if(!speaker){

    alert(
      "まず入室して、発言者を選択してください。"
    );

    return;

  }


  /*
    AIキャラクターを
    「自分で発言」にしても、
    ここでは通常の発言として扱う。
  */

  addMessage({

    type: "message",

    participantId:
      speaker.id,

    name:
      speaker.displayName,

    character:
      speaker.character,

    text:
      text,

    timestamp:
      Date.now()

  });


  input.value = "";

  autoResizeTextarea();


  /*
    AIが発言者の場合でも
    自動返信はさせない。

    AI同士の無限連鎖を防ぐため。
  */

  if(speaker.type === "ai"){
    return;
  }


  /*
    ここが今回の重要部分。

    今まで：
      全AIに返信させる

    今回：
      文脈から返信するAIを決める
  */

  await triggerAIResponses(
    text,
    speaker
  );

}


/* =========================================================
   AI返信対象を決定
========================================================= */

async function triggerAIResponses(
  userText,
  userSpeaker
){

  const aiParticipants =
    participants.filter(
      p =>
        p.type === "ai"
    );


  if(!aiParticipants.length){
    return;
  }


  aiBusy = true;

  updateSendButton();


  try{

    /*
      ① 名前を呼ばれているAIを探す
    */

    const mentioned =
      findMentionedParticipants(
        userText,
        aiParticipants
      );


    let responders = [];


    if(mentioned.length){

      /*
        名前を明示された場合は
        そのAIだけ返信。
      */

      responders =
        mentioned.slice(0,1);

    }else{

      /*
        ② 名前を呼んでいない場合は
           AIを順番に回す。
      */

      const candidates =
        aiParticipants.filter(
          p =>
            p.id !== lastAIResponderId
        );


      if(candidates.length){

        /*
          participants 全体の順番ではなく
          AIだけの順番で回す。
        */

        if(
          aiRoundRobinIndex >=
          candidates.length
        ){

          aiRoundRobinIndex = 0;

        }


        responders = [
          candidates[
            aiRoundRobinIndex
          ]
        ];


        aiRoundRobinIndex++;

      }else{

        responders = [
          aiParticipants[0]
        ];

      }

    }


    /*
      念のため現在も入室しているか確認。
    */

    for(
      const participant of responders
    ){

      const stillOnline =
        participants.some(
          p =>
            p.id === participant.id
        );


      if(!stillOnline){
        continue;
      }


      await requestAIResponse(
        participant,
        userText,
        userSpeaker
      );


      /*
        今回は一人だけ。

        これが重要。

        Aが返した直後にBも返す、
        という構造をやめる。
      */

      lastAIResponderId =
        participant.id;

    }


  }finally{

    aiBusy = false;

    updateSendButton();

  }

}


/* =========================================================
   名前呼び出し判定
========================================================= */

function findMentionedParticipants(
  text,
  aiParticipants
){

  const normalizedText =
    normalizeText(text);


  const result = [];


  aiParticipants.forEach(
    participant => {

      const displayName =
        normalizeText(
          participant.displayName
        );


      const baseName =
        normalizeText(
          getCharacterName(
            participant.character
          )
        );


      /*
        例えば

        相澤仁美（黄ビキニ）

        と

        相澤仁美

        の両方に反応する。
      */

      if(
        displayName &&
        normalizedText.includes(
          displayName
        )
      ){

        result.push(participant);

        return;

      }


      if(
        baseName &&
        normalizedText.includes(
          baseName
        )
      ){

        result.push(participant);

      }

    }
  );


  return result;

}


function normalizeText(text){

  return String(text || "")
    .replace(/\s+/g,"")
    .toLowerCase();

}


/* =========================================================
   AI返信
========================================================= */

async function requestAIResponse(
  participant,
  userText,
  userSpeaker
){

  showTyping(
    participant
  );


  try{

    /*
      AIが見る履歴は
      そのキャラクターに関係するものだけ。
    */

    const relevantHistory =
      getRelevantHistoricalMemory(
        participant
      );


    /*
      重要：

      requestAIResponse が呼ばれる直前の
      roomMessages を取得する。

      つまりAIには
      最新のユーザー発言まで入っている。
    */

    const roomContext =
      buildRoomContext();


    /*
      直前の発言も明示する。
    */

    const lastMessage =
      roomMessages
        .filter(
          message =>
            message.type === "message"
        )
        .slice(-1)[0];


    const openChatInstruction = `

【オープンチャット設定】

あなたは、このルームに参加している
「${participant.displayName}」です。

基本キャラクター設定は、
読み込まれた基本プロンプトを最優先してください。

あなた以外にも複数の参加者がいます。

あなたは「会話の参加者」として自然に発言してください。

AIであること、
プロンプトの存在、
システム上の設定などについて
メタ的に発言しないでください。


【今回の返信対象】

${userSpeaker.displayName}:
${userText}


【重複防止ルール】

非常に重要です。

・直前の参加者がすでに言った内容を、
  そのまま繰り返さない。

・他人の発言の文章をコピーして、
  自分の発言として書かない。

・他人の発言を単に言い換えただけの
  返信にしない。

・「そうだね」「わかる」「私もそう思う」
  だけで終わらない。

・自分自身のキャラクターとして、
  新しい反応、意見、質問、話題を出す。

・すでに十分に話されている内容なら、
  無理に同じ話題を繰り返さない。

・今回の話題に自分が参加する必要がない、
  あるいは自然な発言が思いつかない場合は、

  __NO_REPLY__

  とだけ返してください。


【会話上の注意】

他の参加者が発言した内容を
自分が発言したものとして扱わない。

誰が何を言ったかを区別してください。

自分が直前に発言したわけではない場合、
自分が以前発言したように振る舞わない。

会話を不自然に進行させる必要はありません。


【現在のルームログ】

${roomContext}
`;


    const response =
      await fetch(
        "/api/deepseek",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              history:[
                {
                  role:"user",
                  content:
                    roomContext
                }
              ],

              character:
                participant.character,

              prompt:
                participant.prompt +
                openChatInstruction,

              historicalMemory:
                relevantHistory,

              image:null

            })

        }
      );


    if(!response.ok){

      throw new Error(
        `API Error: ${response.status}`
      );

    }


    const data =
      await response.json();


    /*
      APIの返却形式に合わせる。

      既存APIで response が返る場合と
      answer が返る場合の両方に対応。
    */

    let answer =
      data.response ||
      data.answer ||
      data.text ||
      "";


    answer =
      String(answer).trim();


    /*
      AIが
      「今回は発言しない」
      と判断した場合。
    */

    if(
      !answer ||
      answer === "__NO_REPLY__"
    ){

      return;

    }


    /*
      念のため
      __NO_REPLY__ が文章の中に入った場合も除去。
    */

    answer =
      answer.replace(
        /__NO_REPLY__/g,
        ""
      ).trim();


    if(!answer){
      return;
    }


    /*
      AIの返信をルームに追加。

      ここで初めて roomMessages に入る。
    */

    addMessage({

      type:"message",

      participantId:
        participant.id,

      name:
        participant.displayName,

      character:
        participant.character,

      text:
        answer,

      timestamp:
        Date.now()

    });


  }catch(error){

    console.error(
      "AI response error:",
      error
    );

    addSystemMessage(
      `${participant.displayName} の返信取得中にエラーが発生しました。`
    );

  }finally{

    hideTyping(
      participant
    );

  }

}


/* =========================================================
   ルームコンテキスト
========================================================= */

function buildRoomContext(){

  const messages =
    roomMessages
      .filter(
        message =>
          message.type === "message"
      )
      .slice(-25);


  if(!messages.length){

    return "まだ発言はありません。";

  }


  return messages
    .map(
      message =>
        `${message.name}: ${message.text}`
    )
    .join("\n");

}


/* =========================================================
   キャラクター別履歴
========================================================= */

function getRelevantHistoricalMemory(
  participant
){

  if(!Array.isArray(historyData)){
    return "";
  }


  const characterName =
    getCharacterName(
      participant.character
    );


  let relevant;


  if(
    participant.character === "blank"
  ){

    relevant =
      historyData.filter(
        item => {

          const character =
            String(
              item.character || ""
            );

          return(
            character.includes("大志") ||
            character.includes("神田")
          );

        }
      );

  }else{

    relevant =
      historyData.filter(
        item => {

          const character =
            String(
              item.character || ""
            );

          return(
            character === characterName ||
            character.includes(characterName)
          );

        }
      );

  }


  /*
    最新20件だけ。
  */

  relevant =
    relevant.slice(-20);


  if(!relevant.length){
    return "";
  }


  return relevant
    .map(
      item => {

        return [
          item.date
            ? `日時: ${item.date}`
            : "",

          item.location
            ? `場所: ${item.location}`
            : "",

          item.event
            ? `出来事: ${item.event}`
            : "",

          item.summary
            ? `内容: ${item.summary}`
            : ""

        ]
        .filter(Boolean)
        .join("\n");

      }
    )
    .join("\n\n");

}


/* =========================================================
   キャラクター名
========================================================= */

function getCharacterName(
  character
){

  return (
    CHARACTER_NAMES[character] ||
    character
  );

}


/* =========================================================
   メッセージ追加
========================================================= */

function addMessage(message){

  roomMessages.push(
    message
  );


  renderMessage(
    message
  );


  scrollToBottom();

}


/* =========================================================
   システムメッセージ
========================================================= */

function addSystemMessage(
  text
){

  roomMessages.push({

    type:
      "system",

    text:
      text,

    timestamp:
      Date.now()

  });


  const chatArea =
    document.getElementById(
      "chatArea"
    );


  const empty =
    document.getElementById(
      "emptyRoom"
    );


  if(empty){
    empty.remove();
  }


  const element =
    document.createElement(
      "div"
    );

  element.className =
    "system-message";

  element.textContent =
    text;


  chatArea.appendChild(
    element
  );


  scrollToBottom();

}


/* =========================================================
   メッセージ描画
========================================================= */

function renderMessage(
  message
){

  const chatArea =
    document.getElementById(
      "chatArea"
    );


  const empty =
    document.getElementById(
      "emptyRoom"
    );


  if(empty){
    empty.remove();
  }


  const participant =
    participants.find(
      p =>
        p.id ===
        message.participantId
    );


  const element =
    document.createElement(
      "div"
    );


  element.className =
    "message";


  if(
    participant &&
    participant.type === "user"
  ){

    element.classList.add(
      "user-message"
    );

  }


  /*
    Avatar
  */

  const avatar =
    participant
      ? createAvatar(
          participant
        )
      : createSimpleAvatar(
          message.name
        );


  /*
    Body
  */

  const body =
    document.createElement(
      "div"
    );

  body.className =
    "message-body";


  const meta =
    document.createElement(
      "div"
    );

  meta.className =
    "message-meta";


  const name =
    document.createElement(
      "span"
    );

  name.className =
    "message-name";

  name.textContent =
    message.name;


  const time =
    document.createElement(
      "span"
    );

  time.className =
    "message-time";

  time.textContent =
    formatTime(
      message.timestamp
    );


  meta.appendChild(name);
  meta.appendChild(time);


  const text =
    document.createElement(
      "div"
    );

  text.className =
    "message-text";

  text.textContent =
    message.text;


  body.appendChild(meta);
  body.appendChild(text);


  element.appendChild(
    avatar
  );

  element.appendChild(
    body
  );


  chatArea.appendChild(
    element
  );

}


function createSimpleAvatar(
  name
){

  const avatar =
    document.createElement(
      "div"
    );

  avatar.className =
    "avatar";

  avatar.textContent =
    getInitial(name);

  return avatar;

}


/* =========================================================
   時刻
========================================================= */

function formatTime(
  timestamp
){

  if(!timestamp){
    return "";
  }


  const date =
    new Date(timestamp);


  return date.toLocaleTimeString(
    "ja-JP",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================================================
   Typing表示
========================================================= */

function showTyping(
  participant
){

  hideTyping(
    participant
  );


  const chatArea =
    document.getElementById(
      "chatArea"
    );


  const typing =
    document.createElement(
      "div"
    );

  typing.className =
    "typing";

  typing.id =
    `typing-${participant.id}`;


  typing.innerHTML = `

    <span>
      ${escapeHtml(
        participant.displayName
      )} が入力中
    </span>

    <span class="typing-dots">

      <span></span>
      <span></span>
      <span></span>

    </span>

  `;


  chatArea.appendChild(
    typing
  );


  scrollToBottom();

}


function hideTyping(
  participant
){

  const element =
    document.getElementById(
      `typing-${participant.id}`
    );


  if(element){
    element.remove();
  }

}


/* =========================================================
   スクロール
========================================================= */

function scrollToBottom(){

  const chatArea =
    document.getElementById(
      "chatArea"
    );


  requestAnimationFrame(
    () => {

      chatArea.scrollTop =
        chatArea.scrollHeight;

    }
  );

}


/* =========================================================
   送信ボタン状態
========================================================= */

function updateSendButton(){

  const button =
    document.getElementById(
      "sendButton"
    );


  button.disabled =
    aiBusy;

}


/* =========================================================
   Textarea
========================================================= */

const messageInput =
  document.getElementById(
    "messageInput"
  );


messageInput.addEventListener(
  "input",
  autoResizeTextarea
);


function autoResizeTextarea(){

  messageInput.style.height =
    "auto";

  messageInput.style.height =
    Math.min(
      messageInput.scrollHeight,
      140
    ) + "px";

}


messageInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   Escape
========================================================= */

function escapeHtml(
  value
){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   モーダル外クリック
========================================================= */

document.getElementById(
  "joinOverlay"
).addEventListener(
  "click",
  function(event){

    if(
      event.target === this
    ){

      closeJoinModal();

    }

  }
);

</script>
